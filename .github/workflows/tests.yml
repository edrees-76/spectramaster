name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System libraries for Qt (offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 fonts-dejavu-core fonts-noto-core

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Laboratory, IAEA and DDEP data are not in the repository: the tests that need them skip.
      # The engine timing test is machine dependent (shared CI runners); runtime is tracked by
      # the benchmark (docs/baseline) on the development machine instead.
      - name: Run tests
        run: python -m pytest -q tests -k "not test_timing_16k_channels" -rs
